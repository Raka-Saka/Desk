[package]
name = "desk"
version = "0.1.0"
description = "Basin Desk -- the game-dev desk over docs/tracker"
authors = ["Basin"]
edition = "2021"
# Two binaries (desk, desk-mcp): the Tauri CLI needs to know which one is the app.
default-run = "desk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The MCP server (ADR-0025): a console binary over the same library. `desk` (src/main.rs) is
# still auto-discovered.
[[bin]]
name = "desk-mcp"
path = "src/bin/desk-mcp.rs"

# custom-protocol is what makes the app serve its embedded pages instead of the Vite dev server.
# `cargo tauri build` turns it on; a plain `cargo build --release` did not, and the window then
# showed ERR_CONNECTION_REFUSED for localhost:1420. Default it, so every build path is a real app.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

